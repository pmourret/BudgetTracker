services:

    db:
        image: postgres:16
        container_name: budgets-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - /var/lib/docker/hiatus/budgets/pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: budgets-backend
        restart: unless-stopped
        env_file: .env.prod
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - /var/lib/docker/hiatus/budgets/static:/app/staticfiles
            # Clé PUBLIQUE de l'annuaire (`IDENTITE_CLE_PUBLIQUE_FICHIER`).
            # Un PEM ne rentre pas dans une variable d'environnement : plusieurs
            # lignes, et l'aplatir en `\n` échappés rate silencieusement.
            # En lecture seule — ce conteneur n'a aucune raison d'y écrire.
            # ⚠️ Sans ce montage, BudgetTracker n'accepte AUCUN jeton de
            # l'annuaire, et personne ne peut plus se connecter sous autorité.
            - /var/lib/docker/hiatus/identite/cles/public.pem:/run/cles/annuaire_public.pem:ro
        networks:
            - backend

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.prod
        container_name: budgets-frontend
        restart: unless-stopped
        volumes:
            - /var/lib/docker/hiatus/budgets/static:/usr/share/nginx/static:ro
        networks:
            - proxy
            - backend
        labels:
            - traefik.enable=true
            - traefik.docker.network=proxy
            - traefik.http.routers.budgets.rule=Host(`budgets.sternum-lab.duckdns.org`)
            - traefik.http.routers.budgets.entrypoints=websecure
            - traefik.http.routers.budgets.tls.certresolver=duckdns
            - traefik.http.services.budgets.loadbalancer.server.port=80

networks:
    proxy:
        external: true
    backend:
        external: true
