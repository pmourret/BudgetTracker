# Protocole vu par le NAVIGATEUR, pas par nginx. Traefik termine le TLS et nous
# parle en clair : `$scheme` vaut donc toujours `http` ici. L'écraser ferait
# croire à Django qu'il est servi en HTTP → URLs absolues en http:// (admin) et
# cookies non marqués Secure. On relaie l'en-tête posé par Traefik, avec repli
# sur `$scheme` si l'on est appelé sans proxy devant.
# `map` se déclare au niveau `http` : ce fichier est inclus DANS ce bloc
# (conf.d/*.conf), donc hors du `server` ci-dessous — ne pas le déplacer dedans.
map $http_x_forwarded_proto $proto_navigateur {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    # `_` : c'est Traefik qui route sur le domaine, nginx accepte ce qui lui
    # arrive. Un seul endroit porte le nom d'hôte (docker-compose.prod.yml) —
    # sinon un changement de domaine se corrige à deux endroits, et l'oubli ici
    # ne se voit pas (nginx retombe sur le premier server block).
    server_name _;

    location /static/ {
        alias /usr/share/nginx/static/;
    }

    location ~ ^/(api|admin)/ {
        # Résolution DIFFÉRÉE du backend (DNS embarqué de Docker) : sans la
        # variable, nginx résout `backend` au démarrage et REFUSE de démarrer si
        # le conteneur n'est pas encore joignable — crash-loop au boot du
        # serveur ou pendant un `up -d --force-recreate`. Avec la variable,
        # nginx démarre toujours et renvoie 502 le temps que l'API remonte.
        # `proxy_pass` sans chemin → l'URI d'origine est transmise telle quelle.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_navigateur;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
